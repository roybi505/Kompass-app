<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kompass | הקיץ שלי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col pb-16 selection:bg-indigo-500 selection:text-white">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 py-3 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-black text-indigo-600 tracking-wide flex items-center gap-2">🧭 Kompass</h1>
        <div class="flex gap-1 bg-slate-100 p-1 rounded-xl text-sm font-medium">
            <button id="tab-list-btn" onclick="switchTab('list')" class="px-4 py-1.5 rounded-lg bg-white text-indigo-600 shadow-sm transition-all">הרשימה שלי</button>
            <button id="tab-ai-btn" onclick="switchTab('ai')" class="px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all">העוזר האישי (AI)</button>
        </div>
    </header>

    <main id="tab-list" class="flex-1 p-4 max-w-md mx-auto w-full space-y-6">
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
            <h3 class="font-bold text-slate-700 text-sm">➕ הוספת יעד או משימה</h3>
            <div class="flex gap-2">
                <input type="text" id="item-input" placeholder="למשל: מוזיאון ואן גוך..." class="flex-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500 bg-slate-50">
                <select id="category-input" class="px-2 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500 bg-slate-50">
                    <option value="🎯 אטרקציות">🎯 אטרקציות</option>
                    <option value="🍔 אוכל ומסעדות">🍔 אוכל</option>
                    <option value="🛍️ קניות">🛍️ קניות</option>
                    <option value="✈️ לוגיסטיקה">✈️ לוגיסטיקה</option>
                </select>
                <button onclick="addItem()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-indigo-700 active:scale-95 transition-all">הוסף</button>
            </div>
        </div>

        <div id="list-container" class="space-y-4"></div>
    </main>

    <main id="tab-ai" class="hidden flex-1 flex-col max-w-md mx-auto w-full p-4 h-[calc(100vh-8rem)]">
        <div id="chat-container" class="flex-1 overflow-y-auto space-y-4 mb-4 p-2 bg-slate-100 rounded-2xl border border-slate-200 inner-shadow flex flex-col">
            <div class="bg-indigo-50 border border-indigo-100 p-3 rounded-2xl text-sm max-w-[85%] self-start text-indigo-950">
                היי! אני העוזר האישי שלך לקיץ. אני מכיר את כל הרשימות שלך ויודע מה כבר עשית ומה נשאר. תשאל אותי הכל (המלצות, דרכי הגעה, או מה פתוח)!
            </div>
        </div>
        <div class="flex gap-2 bg-white p-2 rounded-2xl border border-slate-200 shadow-sm">
            <input type="text" id="chat-input" placeholder="שאל את ה-AI על היעדים שלך..." class="flex-1 px-3 py-2 text-sm focus:outline-none bg-slate-50 rounded-xl" onkeypress="if(event.key === 'Enter') sendChatMessage()">
            <button onclick="sendChatMessage()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-indigo-700 transition-all">שלח</button>
        </div>
    </main>

    <script>
        // Initialize Telegram Web App
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        let items = JSON.parse(localStorage.getItem('kompass_items')) || [];

        function saveItems() {
            localStorage.setItem('kompass_items', JSON.stringify(items));
            renderList();
        }

        function switchTab(tab) {
            if (tab === 'list') {
                document.getElementById('tab-list').classList.remove('hidden');
                document.getElementById('tab-ai').classList.add('hidden');
                document.getElementById('tab-list-btn').className = "px-4 py-1.5 rounded-lg bg-white text-indigo-600 shadow-sm transition-all";
                document.getElementById('tab-ai-btn').className = "px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all";
            } else {
                document.getElementById('tab-list').classList.add('hidden');
                document.getElementById('tab-ai').classList.remove('hidden');
                document.getElementById('tab-list-btn').className = "px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all";
                document.getElementById('tab-ai-btn').className = "px-4 py-1.5 rounded-lg bg-white text-indigo-600 shadow-sm transition-all";
            }
        }

        function addItem() {
            const titleInput = document.getElementById('item-input');
            const catInput = document.getElementById('category-input');
            if (!titleInput.value.trim()) return;

            items.push({
                id: Date.now(),
                title: titleInput.value.trim(),
                category: catInput.value,
                completed: false
            });

            titleInput.value = '';
            saveItems();
        }

        function toggleItem(id) {
            items = items.map(item => item.id === id ? { ...item, completed: !item.completed } : item);
            saveItems();
        }

        function deleteItem(id) {
            items = items.filter(item => item.id !== id);
            saveItems();
        }

        function renderList() {
            const container = document.getElementById('list-container');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm font-medium">הרשימה שלך ריקה. תוסיף משהו מגניב לקיץ! ✈️</div>`;
                return;
            }

            const categories = [...new Set(items.map(i => i.category))];

            categories.forEach(cat => {
                const catItems = items.filter(i => i.category === cat);
                let catHtml = `
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="bg-slate-50 px-4 py-2 border-b border-slate-100 font-bold text-xs text-slate-500 uppercase tracking-wider">${cat}</div>
                        <ul class="divide-y divide-slate-100">
                `;

                catItems.forEach(item => {
                    catHtml += `
                        <li class="flex items-center justify-between px-4 py-3 hover:bg-slate-50/50 transition-all">
                            <label class="flex items-center gap-3 flex-1 cursor-pointer select-none">
                                <input type="checkbox" onchange="toggleItem(${item.id})" ${item.completed ? 'checked' : ''} class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500">
                                <span class="text-sm ${item.completed ? 'line-through text-slate-400 font-normal' : 'text-slate-700 font-medium'}">${item.title}</span>
                            </label>
                            <button onclick="deleteItem(${item.id})" class="text-slate-300 hover:text-red-500 p-1 text-sm transition-all">🗑️</button>
                        </li>
                    `;
                });

                catHtml += `</ul></div>`;
                container.innerHTML += catHtml;
            });
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            const chatContainer = document.getElementById('chat-container');

            // Append User Message
            chatContainer.innerHTML += `
                <div class="bg-indigo-600 text-white p-3 rounded-2xl text-sm max-w-[85%] self-end shadow-sm">
                    ${message}
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Append Loading
            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="bg-white border border-slate-200 text-slate-500 p-3 rounded-2xl text-sm max-w-[85%] self-start italic">
                    חושב... 🧭
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, listContext: items })
                });
                const data = await response.json();
                document.getElementById(loadingId).remove();

                chatContainer.innerHTML += `
                    <div class="bg-white border border-slate-200 text-slate-800 p-3 rounded-2xl text-sm max-w-[85%] self-start shadow-sm whitespace-pre-wrap">
                        ${data.reply || 'משהו השתבש, נסה שוב.'}
                    </div>
                `;
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `<div class="bg-red-50 border border-red-200 text-red-600 p-3 rounded-2xl text-sm max-w-[85%] self-start">שגיאת חיבור לשרת.</div>`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Initial render
        renderList();
    </script>
</body>
</html>
